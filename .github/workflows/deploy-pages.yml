# Publica la demo en GitHub Pages en cada push a main.
# URL: https://oscarim79.github.io/Talentia-2.0/
# Requisitos (una sola vez): repo público + Settings → Pages → Source: "GitHub Actions".
name: Deploy a GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verificar variables de Supabase
        run: |
          URL='${{ vars.VITE_SUPABASE_URL }}'
          KEY='${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}'
          if [ -z "$URL" ]; then echo "Falta la variable del repositorio VITE_SUPABASE_URL (Settings > Secrets and variables > Actions > Variables)."; exit 1; fi
          if [ -z "$KEY" ]; then echo "Falta la variable del repositorio VITE_SUPABASE_PUBLISHABLE_KEY (Settings > Secrets and variables > Actions > Variables)."; exit 1; fi
      - run: npm run build
        env:
          GITHUB_PAGES: 'true'
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      # SPA: cualquier ruta profunda (/respuestas, /configuracion…) carga la app.
      - run: cp dist/index.html dist/404.html
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
